[package]
name = "raelin"
version = "0.1.0"
description = "Raelin: a free-form canvas for ideas, notes, flows and database sketches"
authors = ["Raelin contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "raelin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-single-instance = "~2.5.4"
raelin-pipe = { path = "../crates/raelin-pipe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.54", features = ["net", "io-util", "sync", "time"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }
