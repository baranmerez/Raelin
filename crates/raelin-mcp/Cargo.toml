[package]
name = "raelin-mcp"
version = "0.1.0"
description = "stdio MCP bridge to the running Raelin desktop app"
authors = ["Raelin contributors"]
license = "MIT"
edition = "2024"

[dependencies]
raelin-pipe = { path = "../raelin-pipe" }
serde_json = "1"
tokio = { version = "~1.54", features = ["rt", "macros", "io-std", "io-util", "net", "time"] }
