<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="The AI client starts raelin-mcp over stdio; the bridge reaches Raelin through a pipe only your Windows user can open; Raelin checks every batch and applies it to the board as one undo step, and the board is saved to one .rli file">
<title>How Raelin connects an AI client to your board</title>
<style>
text { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
.mono { font-family: "Cascadia Code", "Consolas", ui-monospace, monospace; }
.card { animation: rise .6s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.go { animation: go 4.8s linear infinite; }
.back { animation: back 4.8s linear infinite; }
@keyframes go { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 45% { transform: translateX(860px); opacity: 1; } 50%, 100% { transform: translateX(860px); opacity: 0; } }
@keyframes back { 0%, 50% { transform: translateX(860px); opacity: 0; } 55% { opacity: 1; } 95% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
.lock { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.save { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1; } .go, .back { display: none; } }
</style>
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#46306e" flood-opacity=".14"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a49cae"/></marker>
</defs>

<rect x="1" y="1" width="1198" height="328" rx="22" fill="#fbf8f4" stroke="#ece4da" stroke-width="2"/>

<!-- connectors -->
<g fill="none" stroke="#a49cae" stroke-width="2" marker-end="url(#arrow)">
  <path d="M238 128 H262"/><path d="M478 128 H502"/><path d="M718 128 H742"/><path d="M958 128 H982"/>
</g>

<!-- cards -->
<g filter="url(#soft)">
  <g class="card" style="animation-delay:.05s">
    <rect x="30" y="58" width="206" height="140" rx="16" fill="#ffffff" stroke="#ece4da"/>
    <rect x="30" y="58" width="206" height="8" rx="4" fill="#b79be6"/>
    <text x="50" y="98" font-size="18" font-weight="750" fill="#2e2838">AI client</text>
    <text x="50" y="124" font-size="13.5" fill="#6c6478">Claude Code · Codex</text>
    <text x="50" y="144" font-size="13.5" fill="#6c6478">Claude Desktop · any MCP</text>
    <text class="mono" x="50" y="176" font-size="12.5" fill="#5b3a9e">"draw the signup flow"</text>
  </g>
  <g class="card" style="animation-delay:.2s">
    <rect x="270" y="58" width="206" height="140" rx="16" fill="#ffffff" stroke="#ece4da"/>
    <rect x="270" y="58" width="206" height="8" rx="4" fill="#8c9ad9"/>
    <text x="290" y="98" font-size="18" font-weight="750" fill="#2e2838">raelin-mcp</text>
    <text x="290" y="124" font-size="13.5" fill="#6c6478">stdio bridge, ships with</text>
    <text x="290" y="144" font-size="13.5" fill="#6c6478">the app · reconnects itself</text>
    <text class="mono" x="290" y="176" font-size="12.5" fill="#26305e">JSON-RPC lines</text>
  </g>
  <g class="card" style="animation-delay:.35s">
    <rect x="510" y="58" width="206" height="140" rx="16" fill="#ffffff" stroke="#ece4da"/>
    <rect x="510" y="58" width="206" height="8" rx="4" fill="#8fb27e"/>
    <text x="530" y="98" font-size="18" font-weight="750" fill="#2e2838">Named pipe</text>
    <text x="530" y="124" font-size="13.5" fill="#6c6478">your Windows user only</text>
    <text x="530" y="144" font-size="13.5" fill="#6c6478">per-launch token, local</text>
    <g transform="translate(674 160)"><g class="lock"><rect x="0" y="9" width="22" height="17" rx="4" fill="#8fb27e"/><path d="M5 10 V6 a6 6 0 0 1 12 0 V10" fill="none" stroke="#8fb27e" stroke-width="3"/></g></g>
  </g>
  <g class="card" style="animation-delay:.5s">
    <rect x="750" y="58" width="206" height="140" rx="16" fill="#ffffff" stroke="#ece4da"/>
    <rect x="750" y="58" width="206" height="8" rx="4" fill="#ef8268"/>
    <text x="770" y="98" font-size="18" font-weight="750" fill="#2e2838">Raelin</text>
    <text x="770" y="124" font-size="13.5" fill="#6c6478">typed, atomic batches</text>
    <text x="770" y="144" font-size="13.5" fill="#6c6478">checks revision, asks you</text>
    <text class="mono" x="770" y="176" font-size="12.5" fill="#e06a50">apply_changes</text>
  </g>
  <g class="card" style="animation-delay:.65s">
    <rect x="990" y="58" width="180" height="140" rx="16" fill="#ffffff" stroke="#ece4da"/>
    <rect x="990" y="58" width="180" height="8" rx="4" fill="#e2c164"/>
    <text x="1010" y="98" font-size="18" font-weight="750" fill="#2e2838">Your board</text>
    <text x="1010" y="124" font-size="13.5" fill="#6c6478">updates live</text>
    <text x="1010" y="144" font-size="13.5" fill="#6c6478">one undo step</text>
    <text class="mono" x="1010" y="176" font-size="12.5" fill="#b38a1f">Ctrl+Z</text>
  </g>
</g>

<!-- request and response packets -->
<circle class="go" cx="134" cy="216" r="6" fill="#8e6bd1"/>
<circle class="back" cx="134" cy="228" r="6" fill="#ef8268"/>
<text x="30" y="234" font-size="12.5" fill="#a49cae">request</text>
<text x="956" y="234" font-size="12.5" fill="#a49cae" text-anchor="end">result + new revision</text>

<!-- saved to one file -->
<path class="save" d="M1080 198 V268 H860" fill="none" stroke="#e2c164" stroke-width="2"/>
<g transform="translate(664 250)">
  <rect width="196" height="40" rx="12" fill="#fdf1c9" stroke="#e2c164"/>
  <path d="M16 10 h14 l6 6 v14 h-20z" fill="#fff" stroke="#b38a1f" stroke-width="1.6"/>
  <text x="48" y="25" font-size="14" font-weight="650" fill="#5c4a12">product-ideas.rli</text>
</g>
<text x="664" y="308" font-size="12.5" fill="#a49cae">one JSON file: boards + pictures, saved where you choose</text>
</svg>
